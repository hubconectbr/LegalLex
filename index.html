<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lex | Inteligência Processual Premium</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    
    <style>
        :root {
            --azul-tse: #0f172a;
            --azul-claro: #1e293b;
            --destaque: #2563eb;
            --verde-sucesso: #10b981;
            --cinza-fundo: #f8fafc;
            --cinza-borda: #e2e8f0;
            --branco: #ffffff;
            --terminal-bg: #020617;
            --terminal-text: #22c55e;
        }

        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--cinza-fundo); margin: 0; padding: 20px; color: #334155; line-height: 1.5; }
        .container { max-width: 900px; margin: 0 auto; } 
        
        .header { background: linear-gradient(135deg, var(--azul-tse), var(--azul-claro)); color: white; padding: 30px 20px; border-radius: 16px 16px 0 0; text-align: center; }
        .header h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }

        .tabs { display: flex; background: #fff; border-bottom: 1px solid var(--cinza-borda); }
        .tab-btn { flex: 1; padding: 16px; border: none; background: transparent; color: #64748b; font-weight: 600; cursor: pointer; font-size: 14px; transition: 0.2s; border-bottom: 2px solid transparent; }
        .tab-btn:hover { color: var(--destaque); }
        .tab-btn.active { color: var(--destaque); border-bottom-color: var(--destaque); }

        .card { background: var(--branco); padding: 40px; border-radius: 0 0 16px 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        
        .input-group { margin-bottom: 24px; }
        label { font-weight: 600; color: var(--azul-tse); display: block; margin-bottom: 8px; font-size: 13px; }
        input[type="text"], input[type="password"], textarea, select { width: 100%; border: 1px solid var(--cinza-borda); border-radius: 8px; padding: 14px; font-size: 14px; box-sizing: border-box; background: #fafafa; transition: 0.2s; color: #1e293b; font-family: inherit; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--destaque); background: #fff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .btn-upload { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--cinza-borda); color: #475569; padding: 10px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn-upload:hover { border-color: var(--destaque); color: var(--destaque); background: #eff6ff; }
        input[type="file"] { display: none; }
        
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .file-tag { background: #f1f5f9; border: 1px solid var(--cinza-borda); color: #475569; font-size: 12px; padding: 4px 12px; border-radius: 12px; display: flex; align-items: center; gap: 6px; }
        .file-tag .status { width: 8px; height: 8px; background: var(--verde-sucesso); border-radius: 50%; }

        .btn-analisar { background: var(--azul-tse); color: white; border: none; padding: 16px; width: 100%; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 15px; margin-top: 10px; transition: 0.3s; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15); }
        .btn-analisar:hover { background: var(--destaque); transform: translateY(-1px); box-shadow: 0 6px 15px rgba(37, 99, 235, 0.25); }

        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .terminal-container { display: none; background: var(--terminal-bg); color: var(--terminal-text); font-family: 'SFMono-Regular', Consolas, monospace; padding: 20px; border-radius: 12px; margin-top: 24px; height: 160px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
        .blinking-cursor { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .resultado-card { display: none; background: white; padding: 40px; border-radius: 16px; border-top: 6px solid var(--destaque); box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-top: 24px; font-size: 15px; line-height: 1.7; color: #334155; }
        .resultado-card h2 { color: var(--azul-tse); border-bottom: 1px solid var(--cinza-borda); padding-bottom: 10px; margin-top: 30px; font-size: 18px; }
        .resultado-card h3 { color: var(--destaque); margin-top: 20px; font-size: 16px; }
        
        .flex-row { display: flex; gap: 20px; }
        .flex-1 { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>LEX PLATFORM</h1>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="mudarAba('aba-pedagogica', this)">📚 Avaliação Pedagógica</button>
        <button class="tab-btn" onclick="mudarAba('aba-processos', this)">🔎 Auditoria Processual</button>
    </div>

    <div class="card">
        <div class="flex-row">
            <div class="input-group flex-1">
                <label>🔑 API Key (Google AI):</label>
                <input type="password" id="apiKey" placeholder="Sua chave de autenticação...">
            </div>
            <div class="input-group flex-1">
                <label>🎯 Precedentes / Contexto:</label>
                <input type="text" id="contexto" placeholder="Ex: TRE-SP, Súmula 15 do TSE...">
            </div>
        </div>

        <div id="aba-pedagogica" class="tab-content active">
            <div class="flex-row" style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid var(--cinza-borda); margin-bottom: 24px;">
                <div class="input-group flex-1" style="margin-bottom: 0;">
                    <label>👨‍🏫 Nome do Tutor/Professor:</label>
                    <input type="text" id="tutor_nome" placeholder="Ex: Dr. Carlos Silva">
                </div>
                <div class="input-group flex-1" style="margin-bottom: 0;">
                    <label>🏛️ Unidade / Instituição:</label>
                    <input type="text" id="tutor_inst" placeholder="Ex: EJE/TSE - Polo 1">
                </div>
            </div>

            <div class="input-group">
                <label>📝 Problema Jurídico (Enunciado):</label>
                <textarea id="caso_ped" rows="2"></textarea>
            </div>
            <div class="input-group">
                <label>✍️ Resposta do Cursista:</label>
                <textarea id="resposta_ped" rows="4"></textarea>
            </div>
            
            <div class="input-group">
                <button class="btn-upload" onclick="document.getElementById('normas_ped').click()">📎 Anexar Resoluções (Opcional PDF)</button>
                <input type="file" id="normas_ped" accept=".pdf,.txt" multiple onchange="processarArquivos(this, 'tags_ped', 'texto_normas')" style="display:none;">
                <div id="tags_ped" class="tags-container"></div>
            </div>

            <button class="btn-analisar" onclick="iniciarAnalise('pedagogica')">Executar Avaliação Humanizada</button>
        </div>

        <div id="aba-processos" class="tab-content">
            <div class="input-group" style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid var(--cinza-borda);">
                <label>👤 Perfil do Autor / Operador do Direito:</label>
                <select id="autor_perfil">
                    <option value="Magistrado/Juiz Eleitoral">Magistrado / Juiz Eleitoral (Foco em Decisão)</option>
                    <option value="Assessor Jurídico">Assessor Jurídico (Foco em Triagem e Minuta)</option>
                    <option value="Promotor Eleitoral">Promotor Eleitoral / MPE (Foco em Fiscalização/Acusação)</option>
                    <option value="Advogado">Advogado (Foco em Defesa e Nulidades)</option>
                    <option value="Servidor da Justiça Eleitoral">Servidor da Justiça Eleitoral (Foco Operacional)</option>
                </select>
            </div>

            <div class="input-group">
                <label>📄 Resumo dos Fatos ou Observações:</label>
                <textarea id="obs_proc" rows="2" placeholder="O que eu devo procurar nesta AIJE/AIME?"></textarea>
            </div>
            
            <div class="input-group">
                <label>⚖️ Peça Processual (Copie e cole ou Anexe PDFs):</label>
                <textarea id="texto_proc" rows="3" placeholder="Cole o texto da peça aqui..."></textarea>
            </div>

            <div class="input-group">
                <button class="btn-upload" onclick="document.getElementById('pecas_proc').click()">📎 Anexar Autos/Petições (PDF)</button>
                <input type="file" id="pecas_proc" accept=".pdf,.txt" multiple onchange="processarArquivos(this, 'tags_proc', 'texto_pecas')" style="display:none;">
                <div id="tags_proc" class="tags-container"></div>
            </div>

            <button class="btn-analisar" onclick="iniciarAnalise('processual')">Auditar Processo (Visão Direcionada)</button>
        </div>

        <div id="terminal" class="terminal-container">
            <div id="terminal-output"></div>
            <div><span class="blinking-cursor">_</span></div>
        </div>
    </div>

    <div id="resultado-card" class="resultado-card">
        <div id="resultado-texto"></div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let textosAgregados = { texto_normas: "", texto_pecas: "" };

    function mudarAba(id, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    async function processarArquivos(input, containerId, storageKey) {
        const files = Array.from(input.files);
        const containerUI = document.getElementById(containerId);
        containerUI.innerHTML = "";
        textosAgregados[storageKey] = ""; 

        for (const file of files) {
            const tag = document.createElement('div');
            tag.className = 'file-tag';
            tag.innerHTML = `<div class="status" style="background:#fbbf24;"></div> ${file.name}`;
            containerUI.appendChild(tag);

            try {
                let texto = "";
                if (file.type === "application/pdf") {
                    texto = await extrairTextoPDF(file);
                } else {
                    texto = await file.text();
                }
                textosAgregados[storageKey] += `\n--- DOC: ${file.name} ---\n${texto}\n`;
                tag.querySelector('.status').style.background = "var(--verde-sucesso)";
            } catch (e) {
                tag.querySelector('.status').style.background = "red";
            }
        }
    }

    async function extrairTextoPDF(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
        let totalText = "";
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            totalText += content.items.map(item => item.str).join(' ') + "\n";
        }
        return totalText;
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function logTerminal(message) {
        const output = document.getElementById('terminal-output');
        const container = document.getElementById('terminal');
        const p = document.createElement('div');
        output.appendChild(p);
        p.innerHTML = `> [${new Date().toLocaleTimeString()}] ${message}`;
        container.scrollTop = container.scrollHeight;
        await sleep(500); 
    }

    async function iniciarAnalise(tipo) {
        const apiKey = document.getElementById('apiKey').value;
        if(!apiKey) return alert("⚠️ Insira a API Key para continuar.");

        const terminal = document.getElementById('terminal');
        const resultadoCard = document.getElementById('resultado-card');
        const contextoPrecedentes = document.getElementById('contexto').value.trim();
        
        document.getElementById('terminal-output').innerHTML = '';
        terminal.style.display = 'block';
        resultadoCard.style.display = 'none';

        await logTerminal("Iniciando motor Lex Platform v5.0...");
        
        let promptFinal = "";
        let instrucao = "";

        if(tipo === 'pedagogica') {
            const tutorNome = document.getElementById('tutor_nome').value || "Tutor Especialista";
            const tutorInst = document.getElementById('tutor_inst').value || "Escola Judiciária Eleitoral";
            
            await logTerminal("Aba: Avaliação Pedagógica.");
            await logTerminal(`Identidade assumida: ${tutorNome} (${tutorInst})`);
            
            instrucao = `Você é Lex, Avaliador Pedagógico do TSE. Avalie a resposta do cursista seguindo a estrutura técnica.
            REGRA CRÍTICA: Não invente Súmulas ou Artigos. Se o cursista inventou, você DEVE apontar o erro duramente.
            
            PASSO 8 OBRIGATÓRIO - MENSAGEM FINAL DO MENTOR:
            Redija uma carta final em 1ª pessoa, dirigida ao cursista. Seja empático, mas firme. 
            - Avalie indícios de uso de IA (textos genéricos, falta de vivência prática). Se houver, alerte que a IA é boa para rascunho, mas a "alma" da decisão deve ser do magistrado.
            - Caça a Alucinações: Se o cursista citou legislação inexistente, dê um alerta grave dizendo que isso anularia o processo no mundo real.
            - Assine a carta como: "${tutorNome} - ${tutorInst}".`;

            promptFinal = `PRECEDENTES LOCAIS: ${contextoPrecedentes}\nNORMAS ANEXADAS: ${textosAgregados.texto_normas}\nENUNCIADO: ${document.getElementById('caso_ped').value}\nRESPOSTA DO CURSISTA: ${document.getElementById('resposta_ped').value}`;
        
        } else {
            const perfilAutor = document.getElementById('autor_perfil').value;
            await logTerminal("Aba: Auditoria Processual (AIJE/AIME).");
            await logTerminal(`Calibrando IA para a perspectiva de: ${perfilAutor}`);
            
            instrucao = `Você é Lex, IA atuando como consultor sênior. 
            IMPORTANTE: Seu usuário atual tem o perfil de "${perfilAutor}". 
            Adapte toda a sua análise, linguagem e caça de riscos processuais para interessar a este cargo específico. Se for advogado, foque em teses de defesa; se for juiz, foque na lisura e julgamento; se for promotor, foque em provas para condenação.`;
            
            const pecaCompleta = document.getElementById('texto_proc').value + "\n\n" + textosAgregados.texto_pecas;
            promptFinal = `PRECEDENTES: ${contextoPrecedentes}\nFATOS: ${document.getElementById('obs_proc').value}\nAUTOS: ${pecaCompleta}`;
        }

        await logTerminal("Conectando ao modelo neural para descobrir rota de API...");

        try {
            const modelsReq = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
            const modelsData = await modelsReq.json();
            
            if (modelsData.error) throw new Error(modelsData.error.message);

            const availableModels = modelsData.models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent") && m.name.includes("gemini"));
            if (availableModels.length === 0) throw new Error("Sem modelos disponíveis na sua chave.");

            let selectedModel = availableModels.find(m => m.name.includes("1.5-pro"))?.name || availableModels.find(m => m.name.includes("1.5-flash"))?.name || availableModels[0].name;

            await logTerminal(`Canal seguro estabelecido com: ${selectedModel}`);
            await logTerminal("Avaliando autenticidade do texto e estruturando parecer...");

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${selectedModel}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: instrucao }] },
                    contents: [{ parts: [{ text: promptFinal }] }],
                    generationConfig: { temperature: 0.2 } 
                })
            });
            
            const data = await response.json();
            if(data.error) throw new Error(data.error.message);

            await logTerminal("Auditoria finalizada. Renderizando documento...");

            document.getElementById('resultado-texto').innerHTML = marked.parse(data.candidates[0].content.parts[0].text);
            resultadoCard.style.display = 'block';
            resultadoCard.scrollIntoView({behavior: 'smooth'});

        } catch (e) {
            await logTerminal(`<span style="color:red;">ERRO: ${e.message}</span>`);
        }
    }
</script>
</body>
</html>
